    ProjectUpdateInput:
      type: "object"
      description: "Partial fields; `name` is validated with the same rules as ProjectCreateInput."
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        description:
          type: "string"
          maxLength: 2000
        jobId:
          type: "integer"
          minimum: 1
      additionalProperties: false
    ReportTitleActionInput:
      type: "object"
      description: "One mutation per request; titles normalised to 120 chars server-side."
      properties:
        action:
          type: "string"
          enum:
            - "add"
            - "update"
            - "remove"
            - "set-default"
        title:
          type: "string"
          maxLength: 120
          description: "For add / remove / set-default."
        oldTitle:
          type: "string"
          maxLength: 120
          description: "For update."
        newTitle:
          type: "string"
          maxLength: 120
          description: "For update."
    Job:
      type: "object"
      description: "Prisma `Job` row. `workDays` is a JSON array of ISO weekday numbers 1-7."
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        nameKey:
          type: "string"
          description: "Unique dash slug derived from `name`."
        description:
          type: "string"
          nullable: true
        isArchived:
          type: "boolean"
        workStart:
          type: "string"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        workEnd:
          type: "string"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        workDays:
          type: "array"
          items:
            type: "integer"
            minimum: 1
            maximum: 7
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "name"
        - "nameKey"
        - "workStart"
        - "workEnd"
        - "workDays"
    JobWithProjects:
      allOf:
        - "$ref": "#/components/schemas/Job"
        - type: "object"
          properties:
            _count:
              type: "object"
              properties:
                projects:
                  type: "integer"
      description: "Jobs listing includes project counts."
    Project:
      type: "object"
