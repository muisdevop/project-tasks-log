                    type: "boolean"
                  taskId:
                    type: "integer"
                  minutes:
                    type: "integer"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Job or break type not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/attendance":
    get:
      tags:
        - "Attendance"
      summary: "Today's attendance for a job"
      parameters:
        - name: "jobId"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 1
      responses:
        "200":
          description: "Attendance record, or null when not checked in today."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  attendance:
                    oneOf:
                      - "$ref": "#/components/schemas/JobAttendance"
                      - type: "null"
                        description: "No visit yet today."
                required:
                  - "attendance"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      tags:
        - "Attendance"
      summary: "Check in"
      description: "Rejected when an open visit already exists for the job; the check and the write happen in one transaction (FL-04)."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: "Checked in."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  attendance:
                    "$ref": "#/components/schemas/JobAttendance"
                  message:
                    type: "string"
                    example: "Checked in successfully"
                required:
                  - "attendance"
                  - "message"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Job not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Already checked in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      tags:
        - "Attendance"
      summary: "Check out"
      description: "`totalWorkSeconds` is computed server-side from business hours and returned as `totalWorkTime`."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AttendanceInput"
      responses:
        "200":
          description: "Checked out."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  attendance:
                    "$ref": "#/components/schemas/JobAttendance"
                  message:
                    type: "string"
                    example: "Checked out successfully"
                  totalWorkTime:
                    type: "integer"
                    description: "Seconds."
                required:
                  - "attendance"
                  - "message"
                  - "totalWorkTime"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "No open attendance record."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/stats":
    get:
      tags:
        - "Reports"
      summary: "Dashboard statistics"
      description: "Aggregates every non-archived job, project and task into task counts and business-hours time totals. Source: src/app/api/stats/route.ts."
      responses:
        "200":
          description: "Statistics."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/StatsResponse"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/export":
    get:
      tags:
        - "Reports"
      summary: "Generate an activity report (PDF, HTML fallback)"
      description: "One export runs at a time per server process; a concurrent request gets 429. Ranges are capped at 366 days. `timePeriod=range` requires `startDate` and `endDate`. If Puppeteer cannot produce a PDF the response falls back to `text/html` with the same attachment naming. Source: src/app/api/export/route.ts."
      parameters:
        - name: "timePeriod"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "day"
              - "week"
              - "month"
              - "range"
          description: "Preset window; `range` uses startDate/endDate."
        - name: "groupBy"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "date"
              - "job"
              - "project"
        - name: "startDate"
          in: "query"
          schema:
            type: "string"
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Required with timePeriod=range."
        - name: "endDate"
          in: "query"
          schema:
            type: "string"
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: "jobIds"
          in: "query"
          schema:
            type: "string"
          description: "Comma-separated job ids; empty means every job."
        - name: "projectIds"
          in: "query"
          schema:
            type: "string"
          description: "Comma-separated project ids; empty means every project of the selected jobs."
        - name: "reportTitle"
          in: "query"
          schema:
            type: "string"
            maxLength: 120
      responses:
        "200":
          description: "Report document."
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"<title> (<period>).pdf\"` (or .html on fallback)."
              schema:
                type: "string"
          content:
            "application/pdf":
              schema:
                type: "string"
                format: "binary"
            "text/html":
              schema:
                type: "string"
              description: "PDF-generation fallback."
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "No tasks found for the selected filters."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Another export is already in progress."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/report-titles":
    get:
      tags:
        - "Reports"
      summary: "List saved report titles"
      responses:
        "200":
          description: "Titles."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  options:
                    type: "array"
                    items:
                      type: "string"
                    description: "Always contains \"Activity Report\"."
                  defaultTitle:
                    type: "string"
                required:
                  - "options"
                  - "defaultTitle"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      tags:
        - "Reports"
      summary: "Add, rename, remove or default a report title"
      description: "Titles are normalised (trimmed, inner whitespace collapsed, capped at 120 chars) and deduplicated; the whole mutation runs in one transaction. Not zod-validated: the action is checked in the route, so an unknown action returns 400. Source: src/app/api/report-titles/route.ts."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ReportTitleActionInput"
      responses:
        "200":
          description: "Updated titles."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  options:
                    type: "array"
                    items:
                      type: "string"
                  defaultTitle:
                    type: "string"
                required:
                  - "options"
                  - "defaultTitle"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Title not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/settings":
    get:
      tags:
        - "Settings"
      summary: "Ensure a settings row exists (health of auth setup)"
      description: "Creates the singleton `UserSettings` row when missing and returns `{ ok: true }`. Work schedules are per-job and live on `/api/jobs/{jobId}`; the POST form of this route is a kept-for-compatibility no-op."
      responses:
        "200":
          description: "Settings row present."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    enum:
                      - true
                required:
                  - "ok"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      tags:
        - "Settings"
      summary: "No-op compatibility endpoint"
      description: "Authenticates and returns `{ ok: true }`; it writes nothing."
      responses:
        "200":
          description: "No-op."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    enum:
                      - true
                required:
                  - "ok"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      tags:
        - "Settings"
      summary: "Change the password"
      description: "Verifies the current password, re-hashes at bcrypt cost 12 and bumps `tokenVersion`, revoking every existing session. The new `stl_session` cookie is returned in the same response so the user stays logged in."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: "Password changed."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    enum:
                      - true
                required:
                  - "ok"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Current password is incorrect."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Unable to change password."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/profile":
    get:
      tags:
        - "Settings"
      summary: "Read the user profile"
      responses:
        "200":
          description: "Profile."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  profile:
                    "$ref": "#/components/schemas/Profile"
                  username:
                    type: "string"
                required:
                  - "profile"
                  - "username"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      tags:
        - "Settings"
      summary: "Update the user profile"
      description: "An empty string clears a field to NULL. `email` accepts a valid address or `\"\"`."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: "Saved."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                  profile:
                    "$ref": "#/components/schemas/Profile"
                required:
                  - "ok"
                  - "profile"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Unable to update profile."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "stl_session"
      description: "HttpOnly JWT session cookie issued by `/api/auth/login` (7-day max age, `SameSite=Lax`, `Secure` in production). Carries `{ sub, tv }`; `tv` must match `UserSettings.tokenVersion` so a password change or logout revokes old tokens (SEC-06). There is no CSRF token and no Origin check on mutating routes — see MF-02/AI-02 in the audit for the residual risk."
  schemas:
    Error:
      type: "object"
      description: "Every error body has `error`. Validation failures additionally return `issues` (zod) or `details` (export query)."
      properties:
        error:
          type: "string"
        issues:
          type: "array"
          description: "zod issues, present on some 400 responses."
          items:
            type: "object"
            properties:
              path:
                type: "array"
                items:
                  type: "string"
              message:
                type: "string"
            required:
              - "message"
      required:
        - "error"
    LoginInput:
      type: "object"
      properties:
        username:
          type: "string"
          minLength: 1
        password:
          type: "string"
          minLength: 1
      required:
        - "username"
        - "password"
      additionalProperties: false
    ProjectCreateInput:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        description:
          type: "string"
          maxLength: 2000
      required:
        - "name"
      additionalProperties: false
    JobCreateInput:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        description:
          type: "string"
          maxLength: 2000
      required:
        - "name"
      additionalProperties: false
    JobUpdateInput:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        workStart:
          type: "string"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        workEnd:
          type: "string"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        workDays:
          minItems: 1
          type: "array"
          items:
            type: "integer"
            minimum: 1
            maximum: 7
      additionalProperties: false
    TaskCreateInput:
      type: "object"
      properties:
        projectId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        description:
          type: "string"
          maxLength: 2000
        startedAt:
          type: "string"
          format: "date-time"
          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
        isBreak:
          type: "boolean"
      required:
        - "projectId"
        - "title"
      additionalProperties: false
    TaskActionInput:
      type: "object"
      properties:
        taskId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        action:
          type: "string"
          enum:
            - "complete"
            - "cancel"
            - "resume"
            - "hold"
            - "log-notes"
        details:
          type: "string"
          maxLength: 10000
        notes:
          type: "string"
          maxLength: 10000
      required:
        - "taskId"
        - "action"
      additionalProperties: false
    ChangePasswordInput:
      type: "object"
      properties:
        currentPassword:
          type: "string"
          minLength: 1
        newPassword:
          type: "string"
          minLength: 6
          maxLength: 128
        confirmPassword:
          type: "string"
          minLength: 6
          maxLength: 128
      required:
        - "currentPassword"
        - "newPassword"
        - "confirmPassword"
      additionalProperties: false
    ProfileInput:
      type: "object"
      properties:
        fullName:
          type: "string"
          maxLength: 120
        email:
          anyOf:
            - type: "string"
              const: ""
            - type: "string"
              maxLength: 255
              format: "email"
              pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        title:
          type: "string"
          maxLength: 120
        bio:
          type: "string"
          maxLength: 2000
      additionalProperties: false
    BreakCreateInput:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 100
        type:
          type: "string"
          minLength: 1
          maxLength: 50
        duration:
          type: "integer"
          minimum: 1
          maximum: 480
        isOneTime:
          default: false
          type: "boolean"
        isActive:
          default: true
          type: "boolean"
      required:
        - "name"
        - "type"
        - "isOneTime"
        - "isActive"
      additionalProperties: false
    BreakUpdateInput:
      type: "object"
      properties:
        id:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 1
          maxLength: 100
        type:
          type: "string"
          minLength: 1
          maxLength: 50
        duration:
          anyOf:
            - type: "integer"
              minimum: 1
              maximum: 480
            - type: "null"
        isOneTime:
          type: "boolean"
        isActive:
          type: "boolean"
      required:
        - "id"
      additionalProperties: false
    BreakLogInput:
      type: "object"
      properties:
        jobId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        projectId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 1
          maxLength: 100
        startedAt:
          type: "string"
          format: "date-time"
          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
      required:
        - "jobId"
        - "name"
        - "startedAt"
      additionalProperties: false
    AttendanceInput:
      type: "object"
      properties:
        jobId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        notes:
          anyOf:
            - type: "string"
              maxLength: 2000
            - type: "null"
      required:
        - "jobId"
      additionalProperties: false
    SubtaskCreateInput:
      type: "object"
      properties:
        taskId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        title:
          type: "string"
          minLength: 1
          maxLength: 2000
        isCompleted:
          default: false
          type: "boolean"
      required:
        - "taskId"
        - "title"
        - "isCompleted"
      additionalProperties: false
    SubtaskUpdateInput:
      type: "object"
      properties:
        id:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        title:
          type: "string"
          minLength: 1
          maxLength: 2000
        isCompleted:
          type: "boolean"
      required:
        - "id"
      additionalProperties: false
    ProjectUpdateInput:
      type: "object"
      description: "Partial fields; `name` is validated with the same rules as ProjectCreateInput."
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        description:
          type: "string"
          maxLength: 2000
        jobId:
          type: "integer"
          minimum: 1
      additionalProperties: false
    ReportTitleActionInput:
      type: "object"
      description: "One mutation per request; titles normalised to 120 chars server-side."
      properties:
        action:
          type: "string"
          enum:
            - "add"
            - "update"
            - "remove"
            - "set-default"
        title:
          type: "string"
          maxLength: 120
          description: "For add / remove / set-default."
        oldTitle:
          type: "string"
          maxLength: 120
          description: "For update."
        newTitle:
          type: "string"
          maxLength: 120
          description: "For update."
    Job:
      type: "object"
      description: "Prisma `Job` row. `workDays` is a JSON array of ISO weekday numbers 1-7."
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        nameKey:
          type: "string"
          description: "Unique dash slug derived from `name`."
        description:
          type: "string"
          nullable: true
        isArchived:
          type: "boolean"
        workStart:
          type: "string"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        workEnd:
          type: "string"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        workDays:
          type: "array"
          items:
            type: "integer"
            minimum: 1
            maximum: 7
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "name"
        - "nameKey"
        - "workStart"
        - "workEnd"
        - "workDays"
    JobWithProjects:
      allOf:
        - "$ref": "#/components/schemas/Job"
        - type: "object"
          properties:
            _count:
              type: "object"
              properties:
                projects:
                  type: "integer"
      description: "Jobs listing includes project counts."
    Project:
      type: "object"
      description: "Reduced project object returned by `GET /api/projects`."
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        description:
          type: "string"
          nullable: true
        jobId:
          type: "integer"
      required:
        - "id"
        - "name"
        - "jobId"
    ProjectFull:
      type: "object"
      description: "Complete project row (create response)."
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        nameKey:
          type: "string"
        description:
          type: "string"
          nullable: true
        isArchived:
          type: "boolean"
        jobId:
          type: "integer"
        createdAt:
