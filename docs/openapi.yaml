  "/api/export":
    get:
      tags:
        - "Reports"
      summary: "Generate an activity report (PDF, HTML fallback)"
      description: "One export runs at a time per server process; a concurrent request gets 429. Ranges are capped at 366 days. `timePeriod=range` requires `startDate` and `endDate`. If Puppeteer cannot produce a PDF the response falls back to `text/html` with the same attachment naming. Source: src/app/api/export/route.ts."
      parameters:
        - name: "timePeriod"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "day"
              - "week"
              - "month"
              - "range"
          description: "Preset window; `range` uses startDate/endDate."
        - name: "groupBy"
          in: "query"
          required: true
          schema:
            type: "string"
            enum:
              - "date"
              - "job"
              - "project"
        - name: "startDate"
          in: "query"
          schema:
            type: "string"
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Required with timePeriod=range."
        - name: "endDate"
          in: "query"
          schema:
            type: "string"
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: "jobIds"
          in: "query"
          schema:
            type: "string"
          description: "Comma-separated job ids; empty means every job."
        - name: "projectIds"
          in: "query"
          schema:
            type: "string"
          description: "Comma-separated project ids; empty means every project of the selected jobs."
        - name: "reportTitle"
          in: "query"
          schema:
            type: "string"
            maxLength: 120
      responses:
        "200":
          description: "Report document."
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"<title> (<period>).pdf\"` (or .html on fallback)."
              schema:
                type: "string"
          content:
            "application/pdf":
              schema:
                type: "string"
                format: "binary"
            "text/html":
              schema:
                type: "string"
              description: "PDF-generation fallback."
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "No tasks found for the selected filters."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Another export is already in progress."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/export/data":
    get:
      tags:
        - "Reports"
      summary: "Raw whole-dataset export as machine-readable JSON (MF-06)"
      description: "Every table, nothing aggregated — the complement of `/api/export`, which renders a lossy human report. Archived rows stay in the dump. `UserSettings` is projected explicitly so `passwordHash`/`tokenVersion` can never be included, and the `ApiToken` table is not queried at all (stated in `meta.excluded`). Each collection is capped at 200 000 rows. The response is `no-store` + `attachment`; all `Date` values are ISO strings. Works with either credential (cookie session or any-scope Bearer token). Source: src/app/api/export/data/route.ts."
      parameters:
        - name: "jobId"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
          description: "Scope the dump to one job (absent or empty = whole database). Non-integer values are 400 `{ error: \"Invalid jobId.\" }`, unknown ids 404."
      responses:
        "200":
          description: "Raw data dump envelope."
          headers:
            Content-Disposition:
              description: "`attachment; filename=\"gid-taskflow-data-<yyyy-mm-dd>[-job-<id>].json\"`."
              schema:
                type: "string"
            X-Data-Export-Version:
              description: "Envelope schema version (currently `1`); bumped when fields change."
              schema:
                type: "string"
            X-Data-Export-Generated-At:
              description: "ISO timestamp of generation, same value as `meta.generatedAt`."
              schema:
                type: "string"
                format: "date-time"
            Cache-Control:
              description: "`no-store, no-cache, must-revalidate, proxy-revalidate`."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DataExportResponse"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Job not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
