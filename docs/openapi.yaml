  "/api/attendance":
    get:
      tags:
        - "Attendance"
      summary: "Today's attendance for a job, or its paged history"
      description: "MF-05: without `limit`/`cursor` the response is byte-identical to the old contract — today's open or last check-in row, or null. With `limit` and/or `cursor`, `attendance` instead becomes an ARRAY of history rows (newest first, `checkInTime desc, id desc`) plus `nextCursor`. Source: src/app/api/attendance/route.ts."
      parameters:
        - name: "jobId"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 1
        - "$ref": "#/components/parameters/Q"
        - name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Inclusive `YYYY-MM-DD` lower bound on `checkInTime` (local time)."
        - name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Inclusive `YYYY-MM-DD` upper bound on `checkInTime` (local time)."
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Cursor"
      responses:
        "200":
          description: "Un-paged single row (or null), or paged array — see oneOf."
          content:
            "application/json":
              schema:
                oneOf:
                  - type: "object"
                    description: "Un-paged (no `limit`/`cursor` sent)."
                    properties:
                      attendance:
                        oneOf:
                          - "$ref": "#/components/schemas/JobAttendance"
                          - type: "null"
                            description: "No visit yet today."
                    required:
                      - "attendance"
                  - type: "object"
                    description: "Paged history (`limit` and/or `cursor` sent)."
                    properties:
                      attendance:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/JobAttendance"
                      nextCursor:
                        type: "string"
                        nullable: true
                        description: "Opaque base64url keyset cursor for the next page; `null` on the last page. Only present when the request sent `limit` and/or `cursor`."
                    required:
                      - "attendance"
                      - "nextCursor"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      tags:
        - "Attendance"
      summary: "Check in"
      description: "Rejected when an open visit already exists for the job. FL-04 checked that inside one transaction; PAR-04 made it a database invariant, so the second open row is refused by the partial unique index `JobAttendance_one_open_check_in` (present in both migration sets) and the route answers with the same 409 either way. Idempotent via `Idempotency-Key` (check-in only — check-out is not wrapped)."
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: "Checked in."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  attendance:
                    "$ref": "#/components/schemas/JobAttendance"
                  message:
                    type: "string"
                    example: "Checked in successfully"
                required:
                  - "attendance"
                  - "message"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Job not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Already checked in."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      tags:
        - "Attendance"
      summary: "Check out"
      description: "`totalWorkSeconds` is computed server-side from business hours and returned as `totalWorkTime`."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AttendanceInput"
      responses:
        "200":
          description: "Checked out."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  attendance:
                    "$ref": "#/components/schemas/JobAttendance"
                  message:
                    type: "string"
                    example: "Checked out successfully"
                  totalWorkTime:
                    type: "integer"
                    description: "Seconds."
                required:
                  - "attendance"
                  - "message"
                  - "totalWorkTime"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Not authenticated."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "No open attendance record."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
