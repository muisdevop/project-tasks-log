  "/api/tasks/{taskId}":
    parameters:
      - name: "taskId"
        in: "path"
        required: true
        schema:
          type: "integer"
          minimum: 1
        description: "Numeric task id. Non-numeric or non-positive values are 400."
    delete:
      tags:
        - "Tasks"
      summary: "Hard-delete a terminal task (MD-01 archival cleanup)"
      description: "The only route that removes rows. Opt-in per call: `?hard=true` must be sent literally — absent, `1`, `yes` or `TRUE` are 400, so an accidental DELETE never destroys data. Only terminal tasks (`completed`/`cancelled`) with no unfinished subtasks are reclaimable; `in_progress`/`on_hold` get 409. SubTask and TaskEvent rows are deleted explicitly in the same transaction, a final audit `TaskEvent` is written first and one machine-readable JSON line (`evt: task.hard_deleted`) is logged after commit. Soft-delete semantics are unchanged: completed/cancelled tasks stay in every other list, export and stat until this route is called. Source: src/app/api/tasks/[taskId]/route.ts."
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: "hard"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "true"
              - "false"
          description: "Must be the literal `true` for the delete to execute (validated by taskHardDeleteQuerySchema; anything else — including absence — is a 400)."
      responses:
        "200":
          description: "Deleted, with the pre-delete audit summary."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TaskHardDeleteResult"
        "400":
