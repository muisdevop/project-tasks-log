            - "on_hold"
            - "completed"
            - "cancelled"
        startedAt:
          type: "string"
          format: "date-time"
        endedAt:
          type: "string"
          format: "date-time"
          nullable: true
        elapsedSeconds:
          type: "integer"
          description: "Business-hours seconds; server-computed (SEC-05)."
        completionOutput:
