      description: "AI-02: `ApiTokenView` of every token, newest first — the plaintext was only ever present in its mint response and is not retrievable. Cookie-session ONLY: any request presenting `Authorization: Bearer …` is rejected with 403 even if the token is valid, so a leaked token cannot enumerate or manage credentials. Rate limited to 60 requests/minute per IP. Source: src/app/api/tokens/route.ts."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: "Token listing."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  tokens:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/ApiTokenView"
                required:
                  - "tokens"
        "401":
          description: "No valid session cookie."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "A Bearer token was presented — this route is cookie-only."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited (60/minute per IP)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      tags:
        - "Tokens"
      summary: "Mint a scoped API token (plaintext shown once)"
      description: "Creates a `gid_<40 hex>` token; only its SHA-256 digest is stored. The plaintext appears in this 201 body exactly once (`Copy this token now. It cannot be retrieved again.`). Cookie-session only (403 on any Bearer), rate limited to 10 mints per 5 minutes per session/IP. Idempotent via `Idempotency-Key` with a SHORT 5-minute replay window (a minted secret must not sit replayable for an hour): a retry with the same key and body replays the same plaintext instead of minting a second token. Invalid payloads are 400 `{ error: <first zod issue message> }`."
      security:
        - cookieAuth: []
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ApiTokenCreateInput"
      responses:
        "201":
          description: "Minted — the only time the plaintext is ever returned."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
            Idempotency-Key:
              description: "Echoed back when a key was supplied and the response is now remembered."
              schema:
                type: "string"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  token:
                    "$ref": "#/components/schemas/ApiTokenView"
                  plaintext:
                    type: "string"
                    pattern: "^gid_[a-f0-9]{40}$"
                    description: "Present only on the mint (and on its idempotent replay)."
                  warning:
                    type: "string"
                    example: "Copy this token now. It cannot be retrieved again."
                required:
                  - "token"
                  - "plaintext"
                  - "warning"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "No valid session cookie."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "A Bearer token was presented — minting is cookie-only."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "`Idempotency-Key` was already used with a different request body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "425":
          description: "A request with this `Idempotency-Key` is still running (`Retry-After: 2`)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited (10 mints per 5 minutes)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      tags:
        - "Tokens"
      summary: "Rename or revoke a token"
      description: "Body: `apiTokenUpdateSchema` — `id` plus at least one of `name` / `revoke`. `revoke: true` stamps `revokedAt` and is final (no un-revoke). Cookie-session only, shares the 10-per-5-minutes mint budget with POST/DELETE. Source: src/app/api/tokens/route.ts."
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ApiTokenUpdateInput"
      responses:
        "200":
          description: "Updated token metadata."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  token:
                    "$ref": "#/components/schemas/ApiTokenView"
                required:
                  - "token"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "No valid session cookie."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "A Bearer token was presented — this route is cookie-only."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Token not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited (shares the mint budget)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      tags:
        - "Tokens"
      summary: "Revoke a token (revoke, not erase — the audit row stays)"
      description: "`?id=<tokenId>` (coerced positive integer, 400 `{ error: \"Invalid token ID.\" }` otherwise). Sets `revokedAt` if unset; the row and its digest survive for the audit trail, so a repeated DELETE is a harmless no-op replay returning the same view. Cookie-session only, mint budget. Source: src/app/api/tokens/route.ts."
      security:
        - cookieAuth: []
      parameters:
        - name: "id"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 1
          description: "ApiToken row id (coerced from the query string)."
      responses:
        "200":
          description: "Revoked (or already revoked) token view."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  token:
                    "$ref": "#/components/schemas/ApiTokenView"
                required:
                  - "token"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "No valid session cookie."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "A Bearer token was presented — this route is cookie-only."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Token not found."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited (shares the mint budget)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/admin/events":
    get:
      tags:
        - "Admin"
      summary: "Audit trail feed — every task lifecycle event, keyset-paginated (MF-04)"
      description: "Readable access to the `TaskEvent` table: created/completed/cancelled/resumed/held events, newest first (`eventAt desc, id desc`), every filter applied server-side. Cookie-session ONLY: a Bearer credential (any scope) gets 403, because a long-lived token in an agent config must not harvest every task title in the database. Rate limited to 120 requests/minute per IP — polling loops are a bug. The `snapshot` key is stripped from hard-delete event `meta`. Source: src/app/api/admin/events/route.ts."
      security:
        - cookieAuth: []
      parameters:
        - "$ref": "#/components/parameters/Q"
        - name: "eventType"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "created"
              - "completed"
              - "cancelled"
              - "resumed"
              - "held"
          description: "Mirrors the `TaskEventType` enum; a typo is a 400, not an empty page."
        - name: "taskId"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
        - name: "projectId"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
        - name: "jobId"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Cursor"
      responses:
        "200":
          description: "One page, always with `nextCursor` (null on the last page) and the effective `limit`."
          headers:
            X-Request-Id:
              "$ref": "#/components/headers/XRequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AdminEventPage"
        "400":
          description: "Payload rejected by zod validation or malformed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "No valid session cookie."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "A Bearer token was presented — the feed is cookie-only."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited (120/minute per IP)."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "cookie"
      name: "stl_session"
      description: "HttpOnly JWT session cookie issued by `/api/auth/login` (7-day max age, `SameSite=Lax`, `Secure` in production). Carries `{ sub, tv }`; `tv` must match `UserSettings.tokenVersion` so a password change or logout revokes old tokens (SEC-06). There is no CSRF token and no Origin check on mutating routes — see MF-02/AI-02 in the audit for the residual risk."
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "Opaque `gid_<40 hex>` API token (not a JWT)"
      description: "AI-02: scoped machine credential sent as `Authorization: Bearer <token>`, minted at `POST /api/tokens` (cookie-only). The database stores only its SHA-256 digest. Scopes: `read` = GET only — mutating routes answer 403 `{ error: \"This API token is read-only.\" }`; `write` = GET/POST/PATCH/DELETE. Resolution order: Bearer wins over the session cookie (a request presenting both is treated as the token, so an agent never inherits the browser's full-power session). Revocation is immediate via `revokedAt`/`expiresAt`. Per-token rate limit 120 requests/minute (429 + `Retry-After`); 30 rejected tokens from one IP in 5 minutes escalates to 429. Cookie-only routes (`/api/tokens`, `/api/admin/events`) 403 any Bearer credential. Sources: src/lib/auth.ts, src/lib/api-tokens.ts."
  parameters:
    Q:
      name: "q"
      in: "query"
      required: false
      schema:
        type: "string"
        minLength: 1
        maxLength: 200
      description: "Case-insensitive `contains` search applied server-side (job/project `name`, task/subtask `title`, attendance `notes`, admin feed task `title`)."
    Limit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        default: 50
      description: "Page size. Sending `limit` (and/or `cursor`) opts the response into the paged shape with `nextCursor`. Values above 200 clamp to 200 rather than erroring; 0 or non-integers are a client bug and get 400."
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      schema:
        type: "string"
        minLength: 1
        maxLength: 1024
      description: "Opaque base64url keyset cursor taken from a previous `nextCursor` (never construct one by hand). Malformed cursors are a 400 `{ error: \"Invalid cursor.\" }`."
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_-]{16,128}$"
      description: "AI-03 retry guard for agent callers (src/lib/idempotency.ts). Generate your own 16-128 char [A-Za-z0-9_-] key and reuse it on every retry of the SAME payload: the first request executes and its response is remembered (default 1 h TTL, 5 min for token mints); a retry with the same key and body replays the original status and body with `Idempotency-Replayed: true` echoed back. The same key with a DIFFERENT validated body is refused with 409; a retry while the original is still running gets 425 `Too Early` with `Retry-After: 2`; a malformed key is a 400. Without the header the request behaves exactly as before. The store is in-process: a redeploy or a second replica clears it."
  headers:
    XRequestId:
      description: "MF-04: correlation id stamped by `withRequestLogging` on responses of the routes it wraps (jobs/projects/tasks/subtasks/breaks/breaks-log/attendance collections, tokens, admin feed). Send your own `X-Request-Id` matching `^[A-Za-z0-9_-]{8,64}$` to have it echoed; otherwise a fresh id is generated. Quote it in bug reports — it ties the response to one structured `api.request` log line."
      schema:
        type: "string"
  schemas:
    Error:
      type: "object"
      description: "Every error body has `error`. Validation failures additionally return `issues` (zod) or `details` (export query)."
      properties:
        error:
          type: "string"
        issues:
          type: "array"
          description: "zod issues, present on some 400 responses."
          items:
            type: "object"
            properties:
              path:
                type: "array"
                items:
                  type: "string"
              message:
                type: "string"
            required:
              - "message"
      required:
        - "error"
    LoginInput:
      type: "object"
      properties:
        username:
          type: "string"
          minLength: 1
        password:
          type: "string"
          minLength: 1
      required:
        - "username"
        - "password"
      additionalProperties: false
    ProjectCreateInput:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        description:
          type: "string"
          maxLength: 2000
      required:
        - "name"
      additionalProperties: false
    JobCreateInput:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        description:
          type: "string"
          maxLength: 2000
      required:
        - "name"
      additionalProperties: false
    JobUpdateInput:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        workStart:
          type: "string"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        workEnd:
          type: "string"
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        workDays:
          minItems: 1
          type: "array"
          items:
            type: "integer"
            minimum: 1
            maximum: 7
      additionalProperties: false
    TaskCreateInput:
      type: "object"
      properties:
        projectId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        description:
          type: "string"
          maxLength: 2000
        startedAt:
          type: "string"
          format: "date-time"
          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
        isBreak:
          type: "boolean"
      required:
        - "projectId"
        - "title"
      additionalProperties: false
    TaskActionInput:
      type: "object"
      properties:
        taskId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        action:
          type: "string"
          enum:
            - "complete"
            - "cancel"
            - "resume"
            - "hold"
            - "log-notes"
        details:
          type: "string"
          maxLength: 10000
        notes:
          type: "string"
          maxLength: 10000
      required:
        - "taskId"
        - "action"
      additionalProperties: false
    ChangePasswordInput:
      type: "object"
      properties:
        currentPassword:
          type: "string"
          minLength: 1
        newPassword:
          type: "string"
          minLength: 6
          maxLength: 128
        confirmPassword:
          type: "string"
          minLength: 6
          maxLength: 128
      required:
        - "currentPassword"
        - "newPassword"
        - "confirmPassword"
      additionalProperties: false
    ProfileInput:
      type: "object"
      properties:
        fullName:
          type: "string"
          maxLength: 120
        email:
          anyOf:
            - type: "string"
              const: ""
            - type: "string"
              maxLength: 255
              format: "email"
              pattern: "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$"
        title:
          type: "string"
          maxLength: 120
        bio:
          type: "string"
          maxLength: 2000
      additionalProperties: false
    BreakCreateInput:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 100
        type:
          type: "string"
          minLength: 1
          maxLength: 50
        duration:
          type: "integer"
          minimum: 1
          maximum: 480
        isOneTime:
          default: false
          type: "boolean"
        isActive:
          default: true
          type: "boolean"
      required:
        - "name"
        - "type"
        - "isOneTime"
        - "isActive"
      additionalProperties: false
    BreakUpdateInput:
      type: "object"
      properties:
        id:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 1
          maxLength: 100
        type:
          type: "string"
          minLength: 1
          maxLength: 50
        duration:
          anyOf:
            - type: "integer"
              minimum: 1
              maximum: 480
            - type: "null"
        isOneTime:
          type: "boolean"
        isActive:
          type: "boolean"
      required:
        - "id"
      additionalProperties: false
    BreakLogInput:
      type: "object"
      properties:
        jobId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        projectId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 1
          maxLength: 100
        startedAt:
          type: "string"
          format: "date-time"
          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
      required:
        - "jobId"
        - "name"
        - "startedAt"
      additionalProperties: false
    AttendanceInput:
      type: "object"
      properties:
        jobId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        notes:
          anyOf:
            - type: "string"
              maxLength: 2000
            - type: "null"
      required:
        - "jobId"
      additionalProperties: false
    SubtaskCreateInput:
      type: "object"
      properties:
        taskId:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        title:
          type: "string"
          minLength: 1
          maxLength: 2000
        isCompleted:
          default: false
          type: "boolean"
      required:
        - "taskId"
        - "title"
        - "isCompleted"
      additionalProperties: false
    SubtaskUpdateInput:
      type: "object"
      properties:
        id:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        title:
          type: "string"
          minLength: 1
          maxLength: 2000
        isCompleted:
          type: "boolean"
      required:
        - "id"
      additionalProperties: false
    ApiTokenCreateInput:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 3
          maxLength: 60
        scope:
          default: "read"
          type: "string"
          enum:
            - "read"
            - "write"
        expiresAt:
          anyOf:
            - type: "string"
              format: "date-time"
              pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$"
            - type: "null"
      required:
        - "name"
        - "scope"
      additionalProperties: false
      description: "AI-02 mint request (`apiTokenCreateSchema`). `scope` defaults to `read`; `expiresAt` is an ISO-8601 offset datetime that must be in the future (null/absent = no expiry). A validation failure returns only `{ error: <first issue message> }`."
    ApiTokenUpdateInput:
      type: "object"
      properties:
        id:
          type: "integer"
          exclusiveMinimum: 0
          maximum: 9007199254740991
        name:
          type: "string"
          minLength: 3
          maxLength: 60
        revoke:
          type: "boolean"
      required:
        - "id"
      additionalProperties: false
      description: "PATCH body (`apiTokenUpdateSchema`): `id` plus at least one of `name` (3-60 chars) or `revoke: true`. Revocation is final — there is no un-revoke."
    ApiTokenView:
      type: "object"
      description: "Metadata projection of an `ApiToken` row (`toApiTokenView`) — the secret never appears here; all timestamps are ISO strings."
      properties:
        id:
          type: "integer"
        name:
          type: "string"
        scope:
          type: "string"
          enum:
            - "read"
            - "write"
        createdAt:
          type: "string"
          format: "date-time"
        lastUsedAt:
          type: "string"
          format: "date-time"
          nullable: true
        expiresAt:
          type: "string"
          format: "date-time"
          nullable: true
        revokedAt:
          type: "string"
          format: "date-time"
          nullable: true
        active:
          type: "boolean"
          description: "Not revoked and (no expiry or expiry in the future) at response time."
      required:
        - "id"
        - "name"
        - "scope"
        - "createdAt"
        - "lastUsedAt"
        - "expiresAt"
        - "revokedAt"
        - "active"
    TaskHardDeleteResult:
      type: "object"
      description: "200 body of `DELETE /api/tasks/{taskId}?hard=true`."
      properties:
        deleted:
          type: "boolean"
          enum:
            - true
        task:
          type: "object"
          description: "The row as it was immediately before deletion."
          properties:
            id:
              type: "integer"
            projectId:
              type: "integer"
            title:
              type: "string"
            status:
              type: "string"
              enum:
                - "completed"
                - "cancelled"
            elapsedSeconds:
              type: "integer"
            endedAt:
              type: "string"
              format: "date-time"
              nullable: true
            isBreak:
              type: "boolean"
          required:
            - "id"
            - "projectId"
            - "title"
            - "status"
            - "elapsedSeconds"
            - "isBreak"
        audit:
          type: "object"
          description: "Cascade counts plus the acting identity (`via`: session or token)."
          properties:
            subtaskCount:
              type: "integer"
            eventCount:
              type: "integer"
            actor:
              type: "string"
            via:
              type: "string"
              enum:
                - "session"
                - "token"
          required:
            - "subtaskCount"
            - "eventCount"
            - "actor"
            - "via"
      required:
        - "deleted"
        - "task"
        - "audit"
    AdminEvent:
      type: "object"
      description: "One `TaskEvent` row joined up to its Job (src/lib/admin-events.ts)."
      properties:
        id:
          type: "integer"
        taskId:
          type: "integer"
        eventType:
          type: "string"
          enum:
            - "created"
            - "completed"
            - "cancelled"
            - "resumed"
            - "held"
        eventAt:
          type: "string"
          format: "date-time"
        meta:
          description: "Operator JSON (notes/details snapshots); `null` when empty. The hard-delete `snapshot` key is stripped."
          nullable: true
        task:
          type: "object"
          properties:
            id:
              type: "integer"
            title:
              type: "string"
            status:
              type: "string"
              enum:
                - "in_progress"
                - "on_hold"
                - "completed"
                - "cancelled"
            isBreak:
              type: "boolean"
            projectId:
              type: "integer"
            projectName:
              type: "string"
            jobId:
              type: "integer"
            jobName:
              type: "string"
          required:
            - "id"
            - "title"
            - "status"
            - "isBreak"
            - "projectId"
            - "projectName"
            - "jobId"
            - "jobName"
      required:
        - "id"
        - "taskId"
        - "eventType"
        - "eventAt"
        - "task"
    AdminEventPage:
      type: "object"
      description: "200 body of `GET /api/admin/events` — always the paged envelope (the feed is keyset-paginated by design, unlike the opt-in MF-05 lists)."
      properties:
        events:
          type: "array"
          items:
            "$ref": "#/components/schemas/AdminEvent"
        nextCursor:
          type: "string"
          nullable: true
          description: "Cursor for the next (older) page; `null` on the last page."
        limit:
          type: "integer"
          description: "Effective page size after clamping (default 50, max 200)."
      required:
        - "events"
        - "nextCursor"
        - "limit"
    DataExportResponse:
      type: "object"
      description: "200 body of `GET /api/export/data` (MF-06 raw dump; all dates are ISO strings)."
      properties:
        meta:
          type: "object"
          properties:
            kind:
              type: "string"
              enum:
                - "gid-taskflow-data-export"
            version:
              type: "string"
              description: "Envelope schema version, currently `1`."
            appVersion:
              type: "string"
              description: "`package.json` version or `unknown`."
            generatedAt:
              type: "string"
              format: "date-time"
            scope:
              oneOf:
                - type: "string"
                  enum:
                    - "all"
                - type: "object"
                  properties:
                    jobId:
                      type: "integer"
                  required:
                    - "jobId"
            excluded:
              type: "array"
              items:
                type: "string"
              description: "Always `[\"UserSettings.passwordHash\", \"UserSettings.tokenVersion\", \"ApiToken\"]`."
          required:
            - "kind"
            - "version"
            - "appVersion"
            - "generatedAt"
            - "scope"
            - "excluded"
        counts:
          type: "object"
          description: "Row count per collection (= length of the arrays in `data`, each capped at 200 000)."
          properties:
            settings:
              type: "integer"
            jobs:
              type: "integer"
            projects:
              type: "integer"
            tasks:
              type: "integer"
            subtasks:
              type: "integer"
            breakTypes:
              type: "integer"
            taskEvents:
              type: "integer"
            attendance:
              type: "integer"
          required:
            - "settings"
            - "jobs"
            - "projects"
            - "tasks"
            - "subtasks"
            - "breakTypes"
            - "taskEvents"
            - "attendance"
        data:
          type: "object"
          properties:
            settings:
              nullable: true
              description: "Singleton row or `null`."
              type: "object"
              properties:
                fullName:
                  type: "string"
                  nullable: true
                email:
                  type: "string"
                  nullable: true
                title:
                  type: "string"
                  nullable: true
                bio:
                  type: "string"
                  nullable: true
                reportTitleOptions:
                  nullable: true
                  description: "Stored JSON, normally a string array."
                defaultReportTitle:
                  type: "string"
                  nullable: true
                createdAt:
                  type: "string"
                  format: "date-time"
                updatedAt:
                  type: "string"
                  format: "date-time"
            jobs:
              type: "array"
              items:
                "$ref": "#/components/schemas/Job"
            projects:
              type: "array"
              items:
                "$ref": "#/components/schemas/ProjectFull"
            tasks:
              type: "array"
              items:
                "$ref": "#/components/schemas/RawExportTask"
            subtasks:
              type: "array"
              items:
                "$ref": "#/components/schemas/SubTask"
              description: "Whole `SubTask` table (or the job's slice), independent of the nesting inside `tasks`."
            breakTypes:
              type: "array"
              items:
                "$ref": "#/components/schemas/BreakType"
            taskEvents:
              type: "array"
              items:
                "$ref": "#/components/schemas/ExportTaskEvent"
            attendance:
              type: "array"
              items:
                "$ref": "#/components/schemas/RawExportAttendance"
          required:
            - "settings"
            - "jobs"
            - "projects"
            - "tasks"
            - "subtasks"
            - "breakTypes"
            - "taskEvents"
            - "attendance"
      required:
        - "meta"
        - "counts"
        - "data"
    RawExportTask:
      type: "object"
      description: "Task row plus its project/job link and nested subtasks (`TASK_SELECT` + isBreak/projectId/timestamps)."
      properties:
        id:
          type: "integer"
        projectId:
          type: "integer"
        title:
          type: "string"
        description:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum:
            - "in_progress"
            - "on_hold"
            - "completed"
            - "cancelled"
        startedAt:
          type: "string"
          format: "date-time"
        endedAt:
          type: "string"
          format: "date-time"
          nullable: true
        elapsedSeconds:
          type: "integer"
        completionOutput:
          type: "string"
          nullable: true
        cancellationReason:
          type: "string"
          nullable: true
        logNotes:
          type: "string"
          nullable: true
        isBreak:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        project:
          type: "object"
          properties:
            id:
              type: "integer"
            name:
              type: "string"
            job:
              type: "object"
              properties:
                id:
                  type: "integer"
                name:
                  type: "string"
        subtasks:
          type: "array"
          items:
            type: "object"
            properties:
              id:
                type: "integer"
              title:
                type: "string"
              isCompleted:
                type: "boolean"
            required:
              - "id"
              - "title"
              - "isCompleted"
      required:
        - "id"
        - "projectId"
        - "title"
        - "status"
        - "startedAt"
        - "elapsedSeconds"
        - "isBreak"
    ExportTaskEvent:
      type: "object"
      description: "Raw `TaskEvent` row (no hard-delete snapshot stripping here — this is the backup)."
      properties:
        id:
          type: "integer"
        taskId:
          type: "integer"
        eventType:
          type: "string"
          enum:
            - "created"
            - "completed"
            - "cancelled"
            - "resumed"
            - "held"
        eventAt:
          type: "string"
          format: "date-time"
        meta:
          nullable: true
      required:
        - "id"
        - "taskId"
        - "eventType"
        - "eventAt"
    RawExportAttendance:
      type: "object"
      description: "`JobAttendance` row plus its job name (`ATTENDANCE_SELECT` + timestamps)."
      properties:
        id:
          type: "integer"
        jobId:
          type: "integer"
        job:
          type: "object"
          properties:
            id:
              type: "integer"
            name:
              type: "string"
        checkInTime:
          type: "string"
          format: "date-time"
        checkOutTime:
          type: "string"
          format: "date-time"
          nullable: true
        totalWorkSeconds:
          type: "integer"
        notes:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "jobId"
        - "checkInTime"
